name: Validate static website
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install validation tools (not site runtime)
        run: |
          python -m pip install -r requirements-test.txt
          npm ci --ignore-scripts
          python -m playwright install --with-deps chromium
      - name: Build, package and validate
        run: |
          python tools/build.py
          python tools/package.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tests/run_static_checks.py
          python tests/check_docs.py
          python tools/check_fonts.py
          python tests/check_secrets.py --history
          python -m compileall -q tools tests
          for script in assets/js/*.js; do node --check "$script"; done
          npm run validate
          npm audit --audit-level=moderate
          git diff --exit-code -- index.html en/index.html 404.html sitemap.xml _headers vercel.json
      - name: Test actual package in Chromium with CSP
        run: |
          python tools/serve.py --port 8000 > "$RUNNER_TEMP/site-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for attempt in range(50):
              try:
                  urlopen('http://127.0.0.1:8000/', timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit('Preview did not start')
          PY
          python tests/run_checks.py http://127.0.0.1:8000
      - name: Save browser evidence (not deployment)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-validation
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
